<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Yuki Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(59,130,246,0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(16,185,129,0.10) 0%, transparent 50%);
            pointer-events: none;
        }
        .login-card {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(24px) saturate(1.8);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 28px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 60px -12px rgba(0,0,0,0.5);
            position: relative;
            z-index: 1;
        }
        .login-card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 28px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(59,130,246,0.3), rgba(16,185,129,0.3));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        .logo-icon {
            width: 56px; height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, #3B82F6, #10B981);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 8px 24px rgba(59,130,246,0.3);
        }
        .form-input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: #f1f5f9;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s ease;
        }
        .form-input::placeholder { color: rgba(255,255,255,0.3); }
        .form-input:focus {
            outline: none;
            border-color: rgba(59,130,246,0.4);
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 0 4px rgba(59,130,246,0.08);
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            background: linear-gradient(135deg, #3B82F6, #2563EB);
            color: white;
            font-weight: 600;
            font-size: 15px;
            border: none;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
            box-shadow: 0 4px 16px rgba(59,130,246,0.3);
            font-family: inherit;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(59,130,246,0.4); }
        .btn-login:active { transform: scale(0.97); }
        .btn-login:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .error-box {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.2);
            border-radius: 12px;
            padding: 12px 16px;
            color: #fca5a5;
            font-size: 13px;
            display: none;
        }
        .error-box.show { display: block; }
        .glow-text {
            background: linear-gradient(135deg, #60A5FA, #34D399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        .status-dot {
            display: inline-block;
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #34D399;
            animation: pulse-glow 2s ease-in-out infinite;
            margin-right: 6px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        </div>

        <h1 class="text-2xl font-bold text-center text-white mb-1">Admin Panel</h1>
        <p class="text-center text-slate-400 text-sm mb-8">Yuki Store <span class="text-slate-500">•</span> <span class="glow-text">Regal</span></p>

        <div id="loginError" class="error-box mb-5">
            <div class="flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
                <span id="errorMessage">Username atau password salah</span>
            </div>
        </div>

        <form id="loginForm">
            <div class="mb-4">
                <label class="block text-slate-300 text-sm font-medium mb-1.5">Username</label>
                <input type="text" id="username" class="form-input" placeholder="Masukkan username" required autofocus>
            </div>
            <div class="mb-6">
                <label class="block text-slate-300 text-sm font-medium mb-1.5">Password</label>
                <input type="password" id="password" class="form-input" placeholder="Masukkan password" required>
            </div>
            <button type="submit" id="loginBtn" class="btn-login">
                <span id="btnText">Login</span>
                <span id="btnSpinner" class="hidden inline-block w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin ml-2"></span>
            </button>
        </form>

        <div class="mt-6 text-center">
            <span class="text-xs text-slate-500">Sistem aman • <span class="status-dot"></span>Server online</span>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('btnSpinner');
            const errorBox = document.getElementById('loginError');
            const errorMsg = document.getElementById('errorMessage');

            btn.disabled = true;
            btnText.textContent = 'Memproses...';
            spinner.classList.remove('hidden');
            errorBox.classList.remove('show');

            try {
                const res = await fetch('/api/admin/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('adminToken', data.token);
                    localStorage.setItem('adminUser', data.user || 'Admin');
                    window.location.href = '/admin/';
                } else {
                    errorMsg.textContent = data.message || 'Login gagal';
                    errorBox.classList.add('show');
                }
            } catch (err) {
                errorMsg.textContent = 'Terjadi kesalahan. Coba lagi.';
                errorBox.classList.add('show');
            } finally {
                btn.disabled = false;
                btnText.textContent = 'Login';
                spinner.classList.add('hidden');
            }
        });

        // Enter key submit
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('loginForm').dispatchEvent(new Event('submit'));
        });
    </script>

</body>
</html>
